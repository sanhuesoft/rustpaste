[package]
name = "rustpaste"
version = "0.1.0"
edition = "2024"
description = "Open source clipboard manager for macOS inspired by Paste"
license = "MIT"

[lib]
name = "rustpaste"
path = "src/lib.rs"

[[bin]]
name = "rustpaste"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = "0.36"
egui = "0.36"
global-hotkey = "0.8"
tray-icon = "0.26"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSBitmapImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSRunningApplication",
    "NSSound",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSGeometry",
] }
core-graphics = "0.25"
core-foundation = "0.10"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
